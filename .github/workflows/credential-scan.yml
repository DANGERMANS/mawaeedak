name: Credential Scan

on:
  push:
    branches:
      - main
      - develop
      - 'fix/**'
      - 'feature/**'
  pull_request:
    branches:
      - main

concurrency:
  group: credential-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run credential scan
        run: |
          echo "=== CREDENTIAL SCAN ==="
          
          # Patterns that should NOT be committed
          PATTERNS=(
            "-----BEGIN PRIVATE KEY-----"
            "-----BEGIN RSA PRIVATE KEY-----"
            "-----BEGIN EC PRIVATE KEY-----"
            "-----BEGIN OPENSSH PRIVATE KEY-----"
            "eyJ[a-zA-Z0-9]{10,}\.eyJ[a-zA-Z0-9]{10,}\.[a-zA-Z0-9_-]{10,}"
            "sk-[a-zA-Z0-9]{20,}"
            "ghp_[a-zA-Z0-9]{36}"
            "gho_[a-zA-Z0-9]{36}"
            "ghu_[a-zA-Z0-9]{36}"
            "ghs_[a-zA-Z0-9]{36}"
            "ghr_[a-zA-Z0-9]{36}"
            "xox[pborsa]-[0-9]{10,13}-[0-9]{10,13}-[a-zA-Z0-9_-]{52}"
            "AKIA[0-9A-Z]{16}"
            "[a-zA-Z0-9/+=]{40}"
          )
          
          FOUND_ISSUES=0
          
          # Scan source files (excluding node_modules and build artifacts)
          echo ""
          echo "Scanning source files..."
          for pattern in "${PATTERNS[@]}"; do
            matches=$(git log --all --oneline --name-only -p \
              --since="90 days ago" \
              -- '*.ts' '*.tsx' '*.js' '*.jsx' '*.json' '*.sql' \
              | grep -v node_modules \
              | grep -v dist \
              | grep -v build \
              | xargs grep -lE "$pattern" 2>/dev/null || true)
            
            if [ -n "$matches" ]; then
              echo "⚠️  Found potential credential pattern: $pattern"
              echo "$matches" | while read file; do
                echo "  - $file"
              done
              FOUND_ISSUES=1
            fi
          done
          
          # Check for real VAPID keys in files
          echo ""
          echo "Checking for VAPID keys..."
          vapid_check=$(grep -r "VAPID_PRIVATE_KEY" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" . 2>/dev/null | grep -v "example" | grep -v "# " | grep -v "//" | grep -v "node_modules" | grep -v dist | wc -l)
          
          if [ "$vapid_check" -gt 0 ]; then
            echo "⚠️  Found VAPID_PRIVATE_KEY references (should only be in env vars)"
            grep -r "VAPID_PRIVATE_KEY" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" . 2>/dev/null | grep -v "example" | grep -v "# " | grep -v "//" | grep -v "node_modules" | grep -v dist || true
            FOUND_ISSUES=1
          fi
          
          # Check for real Supabase keys (not placeholders)
          echo ""
          echo "Checking for Supabase keys..."
          supabase_check=$(grep -rE "VITE_SUPABASE_ANON_KEY=eyJ[a-zA-Z0-9_-]{20,}" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.json" --include="*.env*" . 2>/dev/null | grep -v "example" | grep -v "node_modules" | grep -v dist | wc -l)
          
          if [ "$supabase_check" -gt 0 ]; then
            echo "⚠️  Found real Supabase anon key (should be placeholder only)"
            FOUND_ISSUES=1
          fi
          
          # Check for package-lock.json (should use pnpm)
          echo ""
          echo "Checking for package-lock.json..."
          if [ -f "package-lock.json" ]; then
            echo "⚠️  Found package-lock.json (should use pnpm-lock.yaml only)"
            FOUND_ISSUES=1
          fi
          
          echo ""
          echo "=== SCAN COMPLETE ==="
          
          if [ "$FOUND_ISSUES" -eq 1 ]; then
            echo "⚠️  Issues found. Please review above warnings."
            exit 1
          else
            echo "✅ No credentials or issues detected."
            exit 0
          fi